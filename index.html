<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bờm và La Bàn Ước Mơ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E3BF; --ink:#2B2118; --muted:#6B5544; --frame:#2B2118;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#13262B; --ink:#F3E3BF; --muted:#A9B9B5; --frame:#E8A33D; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#13262B; --ink:#F3E3BF; --muted:#A9B9B5; --frame:#E8A33D; color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
h1{ margin:0; font-size:clamp(2rem,6vw,3.2rem); font-weight:800; line-height:1; letter-spacing:-0.01em; text-align:center; }
.sub{ margin:4px 0 14px; color:var(--muted); font-size:1.05rem; text-align:center; }
.stage{ position:relative; width:100%; max-width:960px; aspect-ratio:16/9; border:3px solid var(--frame); border-radius:16px; overflow:hidden; background:#7CC4F2; }
canvas{ display:block; width:100%; height:100%; touch-action:none; }
.overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:16px; text-align:center; color:#FFF6E2; background:rgba(43,33,24,.62); overflow:auto; }
.overlay[hidden]{ display:none; }
.overlay h2{ margin:0; font-size:clamp(1.5rem,5vw,2.6rem); font-weight:800; line-height:1.05; }
.overlay p{ margin:0; max-width:44ch; font-size:clamp(.92rem,2.4vw,1.08rem); line-height:1.35; }
.big{ margin-top:4px; font:inherit; font-weight:800; font-size:1.2rem; padding:6px 26px; border-radius:999px; cursor:pointer;
  border:3px solid #2B2118; background:#E8A33D; color:#2B2118; }
.big:hover{ background:#F2B95A; }
button:focus-visible{ outline:3px solid #FFF6E2; outline-offset:3px; }
.touch{ position:absolute; left:10px; right:10px; bottom:10px; display:none; justify-content:space-between; pointer-events:none; }
.touch .grp{ display:flex; gap:10px; }
.touch button{ pointer-events:auto; width:60px; height:60px; border-radius:50%; font-size:1.5rem; line-height:1;
  border:3px solid #2B2118; background:rgba(255,246,226,.8); color:#2B2118; touch-action:none; user-select:none; -webkit-user-select:none; }
@media (pointer:coarse){ .touch{ display:flex; } }
.keys{ margin-top:12px; color:var(--muted); font-size:1rem; text-align:center; max-width:60ch; }
kbd{ font-family:inherit; font-weight:700; border:2px solid var(--muted); border-radius:6px; padding:0 6px; }
</style>
</head>
<body>
<h1>Bờm và La Bàn Ước Mơ</h1>
<p class="sub" id="subTitle">Màn 1: Đảo Dừa</p>

<div class="stage">
  <canvas id="game" aria-label="Màn chơi Bờm và La Bàn Ước Mơ"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle"></h2>
    <div id="ovText" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>
    <button class="big" id="ovBtn"></button>
  </div>
  <div class="touch" aria-hidden="true">
    <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="grp"><button data-k="jump">⤒</button></div>
  </div>
</div>

<p class="keys"><kbd>←</kbd> <kbd>→</kbd> để chạy, <kbd>Space</kbd> hoặc <kbd>↑</kbd> để nhảy. Trên điện thoại dùng nút trên màn hình.</p>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const H = 450, GY = 380;
let W = 800;

function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(r.width / r.height * H);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ================= Dữ liệu màn chơi =================
const LEVELS = [
  {
    name:'Màn 1: Đảo Dừa', theme:'day', end:6300,
    ground:[[0,900],[1030,1700],[1830,2600],[2740,3800],[3940,4900],[5040,6500]],
    plats:[[600,290,140],[1250,300,120],[1450,230,120],[2000,280,160],[2300,210,120],[3000,290,140],[3250,220,140],
           [3500,160,120],[4150,290,120],[4400,230,140],[4650,300,120],[5300,280,160],[5600,210,120]],
    rows:[300,760,1520,2440,3640,4740,5780],
    crabs:[[420,200,860],[1350,1060,1680],[2150,1860,2580],[2950,2780,3780],[3400,2780,3780],[4350,3980,4880],[5450,5080,5980]],
    pirates:[],
    decor:[180,1120,2180,3080,4260,5250,5880],
    intro:['Ông nội kể rằng chiếc la bàn chỉ về ước mơ đã bị chia thành năm mảnh, giấu trên năm hòn đảo. Mảnh đầu tiên nằm đâu đó trên Đảo Dừa.',
           'Giúp Bờm vượt qua lũ cua canh đảo, nhặt đồng vàng và tìm mảnh la bàn ở cuối đảo.'],
    winTitle:'Mảnh la bàn thứ nhất!',
    winText:s=>[`Chú khỉ Mận ở Đảo Dừa quyết định theo Bờm ra khơi.`, `Bạn nhặt được ${s} đồng vàng ở màn này.`]
  },
  {
    name:'Màn 2: Đảo Sương Mù', theme:'fog', end:6900,
    ground:[[0,800],[930,1600],[1750,2400],[2550,3300],[3440,4200],[4340,5100],[5240,5900],[6030,7100]],
    plats:[[500,290,130],[1100,300,120],[1300,230,120],[1500,170,110],[1950,290,140],[2200,220,120],[2700,280,140],
           [2950,210,120],[3150,150,120],[3600,290,120],[3850,220,140],[4500,290,140],[4750,220,120],[5400,280,140],
           [5650,210,120],[6200,290,140]],
    rows:[200,1000,1800,2600,3500,4400,5300,6100],
    crabs:[[300,100,790],[2000,1760,2390],[4500,4350,5090]],
    pirates:[[1200,940,1590],[2900,2560,3290],[3800,3450,4190],[5500,5250,5890],[6400,6040,6640]],
    decor:[350,1350,2150,3000,3900,4700,5600,6350],
    intro:['Mận nhảy lên vai Bờm, hai đứa giong thuyền về phía một hòn đảo chìm trong sương trắng. Người ta đồn một băng hải tặc đối thủ cũng đang săn mảnh la bàn thứ hai.',
           'Sương dày nên chỉ thấy được quanh Bờm. Coi chừng lũ hải tặc, chúng hay bật nhảy bất ngờ.'],
    winTitle:'Mảnh la bàn thứ hai!',
    winText:s=>[`Cô hoa tiêu Sen đã bám theo băng hải tặc kia nhiều ngày. Thấy Bờm hạ được chúng, Sen xin nhập hội.`,
                `Bạn nhặt được ${s} đồng vàng ở màn này. Ba mảnh còn lại vẫn đang chờ ngoài khơi xa.`]
  }
];

const THEMES = {
  day:{ sky:['#2F8FDB','#6FBDF0','#CDEEFF'], sun:true, cloud:'rgba(255,255,255,.95)', isle:'#4F9C78', sea:['#22A6BF','#0E6585'], wave:'rgba(255,255,255,.4)', sand:['#E2C07E','#F2D9A0'] },
  fog:{ sky:['#8FA3AE','#AFC0C7','#D3DCDF'], sun:false, cloud:'rgba(235,240,242,.8)', isle:'#71878F', sea:['#4E7F8C','#2B5059'], wave:'rgba(230,238,240,.3)', sand:['#B9A884','#CDBE9A'] }
};

// ================= Trạng thái =================
let L, T, lvl = 0, ground, plats, goal, END, coins, enemies, player, camX, lives, score, bank = 0, state = 'intro', safeX, tick = 0, trail = [];

function makeCoins(){
  const c = [];
  plats.forEach(pl => { for (let i=0;i<3;i++) c.push({x:pl.x+pl.w/2-30+i*30, y:pl.y-28}); });
  for (let i=0;i<ground.length-1;i++){
    const a = ground[i][1], b = ground[i+1][0];
    for (let k=0;k<3;k++) c.push({x:a+(b-a)*(k+1)/4, y:GY-95-(k===1?22:0)});
  }
  L.rows.forEach(x => { for (let i=0;i<4;i++) c.push({x:x+i*28, y:GY-30}); });
  return c.map(o => ({...o, got:false}));
}

function loadLevel(i){
  lvl = i; L = LEVELS[i]; T = THEMES[L.theme];
  ground = L.ground; END = L.end; goal = {x:L.end-150, w:46};
  plats = L.plats.map(([x,y,w]) => ({x,y,w}));
  coins = makeCoins();
  enemies = [
    ...L.crabs.map(([x,min,max]) => ({kind:'crab', x, y:GY-22, base:GY-22, w:38, h:22, min, max, dir:-1, sp:1.2, dead:0, vy:0})),
    ...L.pirates.map(([x,min,max]) => ({kind:'pirate', x, y:GY-44, base:GY-44, w:30, h:44, min, max, dir:-1, sp:1.7, dead:0, vy:0, jt:60+Math.random()*120}))
  ];
  player = {x:80, y:GY-40, w:34, h:40, vx:0, vy:0, onGround:true, face:1, inv:0, coyote:0};
  camX = 0; lives = 3; score = 0; safeX = 80; trail = [];
  document.getElementById('subTitle').textContent = L.name;
}

// ================= Màn hình phủ =================
const ov = document.getElementById('overlay');
let ovAction = null;
function showOverlay(title, paras, btn, action){
  document.getElementById('ovTitle').textContent = title;
  const box = document.getElementById('ovText'); box.innerHTML = '';
  paras.forEach(t => { const p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
  const b = document.getElementById('ovBtn'); b.textContent = btn; ovAction = action;
  ov.hidden = false; b.focus();
}
document.getElementById('ovBtn').onclick = () => ovAction && ovAction();

function showIntro(i){
  loadLevel(i); state = 'intro';
  showOverlay(L.name, L.intro, 'Ra khơi', () => { state = 'play'; ov.hidden = true; });
}
function levelClear(){
  state = 'clear'; bank += score;
  const last = lvl === LEVELS.length - 1;
  const paras = L.winText(score);
  if (last) paras.push(`Tổng cộng: ${bank} đồng vàng.`);
  showOverlay(L.winTitle, paras, last ? 'Chơi lại từ đầu' : `Sang màn ${lvl+2}`,
    () => { if (last) bank = 0; showIntro(last ? 0 : lvl+1); });
}
function gameOver(){
  state = 'over';
  showOverlay('Bờm phải về thuyền nghỉ ngơi', ['Mảnh la bàn vẫn đang chờ. Thử lại màn này nhé.'], 'Thử lại',
    () => { loadLevel(lvl); state = 'play'; ov.hidden = true; });
}

// ================= Điều khiển =================
const keys = {left:false, right:false, jump:false, jumpBuf:0};
const map = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump'};
window.addEventListener('keydown', e => {
  const k = map[e.code]; if (!k) return;
  if (state === 'play') e.preventDefault();
  if (k === 'jump' && !keys.jump) keys.jumpBuf = 8;
  keys[k] = true;
});
window.addEventListener('keyup', e => { const k = map[e.code]; if (k) keys[k] = false; });
document.querySelectorAll('.touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (k==='jump' && !keys.jump) keys.jumpBuf = 8; keys[k] = true; });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, e => { e.preventDefault(); keys[k] = false; }));
});

// ================= Cập nhật =================
function hurt(fell){
  lives--;
  if (lives <= 0){ gameOver(); return; }
  player.inv = 90;
  if (fell){ player.x = safeX; player.y = GY - player.h - 60; player.vx = 0; player.vy = 0; }
  else { player.vy = -6; player.vx = -player.face * 4; }
}

function update(d){
  const p = player;
  if (keys.left){ p.vx -= 0.7*d; p.face = -1; }
  if (keys.right){ p.vx += 0.7*d; p.face = 1; }
  if (!keys.left && !keys.right) p.vx *= Math.pow(0.8, d);
  p.vx = Math.max(-4.4, Math.min(4.4, p.vx));

  if (keys.jumpBuf > 0 && (p.onGround || p.coyote > 0)){ p.vy = -11.5; p.onGround = false; p.coyote = 0; keys.jumpBuf = 0; }
  keys.jumpBuf = Math.max(0, keys.jumpBuf - d);

  p.vy += 0.55*d;
  if (!keys.jump && p.vy < 0) p.vy += 0.5*d;
  p.vy = Math.min(p.vy, 14);

  const prevBottom = p.y + p.h;
  p.x = Math.max(0, Math.min(END - p.w, p.x + p.vx*d));
  p.y += p.vy*d;
  p.onGround = false;

  if (p.vy >= 0){
    const bottom = p.y + p.h, a1 = p.x + 6, a2 = p.x + p.w - 6;
    for (const [a,b] of ground){
      if (a2 > a && a1 < b && prevBottom <= GY + 0.5 && bottom >= GY){
        p.y = GY - p.h; p.vy = 0; p.onGround = true;
        if (p.x > a + 20 && p.x + p.w < b - 40) safeX = Math.max(safeX, p.x);
      }
    }
    for (const pl of plats){
      if (a2 > pl.x && a1 < pl.x + pl.w && prevBottom <= pl.y + 0.5 && bottom >= pl.y){ p.y = pl.y - p.h; p.vy = 0; p.onGround = true; }
    }
  }
  p.coyote = p.onGround ? 6 : p.coyote - d;
  if (p.inv > 0) p.inv -= d;

  trail.push({x:p.x + p.w/2, y:p.y + p.h, f:p.face});
  if (trail.length > 40) trail.shift();

  if (p.y > H + 40){ hurt(true); if (state !== 'play') return; }

  for (const c of coins){
    if (!c.got && c.x+9 > p.x && c.x-9 < p.x+p.w && c.y+9 > p.y && c.y-9 < p.y+p.h){ c.got = true; score++; }
  }

  for (const en of enemies){
    if (en.dead){ en.dead += d; continue; }
    en.x += en.dir * en.sp * d;
    if (en.x < en.min){ en.x = en.min; en.dir = 1; }
    if (en.x + en.w > en.max){ en.x = en.max - en.w; en.dir = -1; }
    if (en.kind === 'pirate'){
      en.jt -= d;
      if (en.jt <= 0 && en.y >= en.base){ en.vy = -8; en.jt = 110 + Math.random()*130; }
      en.vy += 0.5*d; en.y += en.vy*d;
      if (en.y >= en.base){ en.y = en.base; en.vy = 0; }
    }
    if (p.x + p.w > en.x && p.x < en.x + en.w && p.y + p.h > en.y && p.y < en.y + en.h){
      if (p.vy > 0 && prevBottom <= en.y + 10){ en.dead = 1; p.vy = -8; score += en.kind === 'pirate' ? 3 : 2; }
      else if (p.inv <= 0){ hurt(false); if (state !== 'play') return; }
    }
  }

  if (p.x + p.w > goal.x){ levelClear(); return; }

  const target = Math.max(0, Math.min(END + 200 - W, p.x - W*0.35));
  camX += (target - camX) * Math.min(1, 0.15*d);
}

// ================= Vẽ =================
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); }
function tri(a,b,c,d2,e,f){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d2); ctx.lineTo(e,f); ctx.closePath(); ctx.fill(); }
function wrap(v,m){ return ((v % m) + m) % m; }

function drawBackground(){
  const sky = ctx.createLinearGradient(0,0,0,330);
  sky.addColorStop(0,T.sky[0]); sky.addColorStop(.6,T.sky[1]); sky.addColorStop(1,T.sky[2]);
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,330);

  const sunX = W*0.18 - camX*0.02, sunY = 70;
  if (T.sun){
    const glow = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,130);
    glow.addColorStop(0,'rgba(255,250,220,.9)'); glow.addColorStop(1,'rgba(255,250,220,0)');
    ctx.fillStyle = glow; ctx.fillRect(sunX-130,sunY-130,260,260);
    ctx.fillStyle = '#FFF6CC'; circle(sunX, sunY, 34);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.35)'; circle(sunX, sunY, 30);
  }

  ctx.fillStyle = T.cloud;
  for (let i=-1;i<W/420+2;i++){
    const ox = i*420 - wrap(camX*0.1 + tick*0.15, 420);
    ellipse(ox+80,80,46,14); ellipse(ox+110,70,32,14); ellipse(ox+290,130,36,10);
  }

  ctx.fillStyle = T.isle;
  for (let i=-1;i<W/640+2;i++){
    const ox = i*640 - wrap(camX*0.2, 640);
    ctx.beginPath(); ctx.moveTo(ox+60,330); ctx.quadraticCurveTo(ox+170,250,ox+300,330); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ox+380,330); ctx.quadraticCurveTo(ox+440,290,ox+520,330); ctx.fill();
  }

  const sea = ctx.createLinearGradient(0,330,0,H);
  sea.addColorStop(0,T.sea[0]); sea.addColorStop(1,T.sea[1]);
  ctx.fillStyle = sea; ctx.fillRect(0,330,W,H-330);

  ctx.strokeStyle = T.wave; ctx.lineWidth = 2;
  for (let row=0; row<5; row++){
    const y = 345 + row*22, sp = 0.3 + row*0.12;
    for (let i=-1;i<W/90+2;i++){
      const ox = i*90 - wrap(camX*sp - tick*0.4, 90) + (row%2)*45;
      ctx.beginPath(); ctx.arc(ox, y, 10, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    }
  }
}

function drawPalm(x){
  const sx = x - camX; if (sx < -120 || sx > W+120) return;
  ctx.strokeStyle = '#7A4E30'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx,GY); ctx.quadraticCurveTo(sx+18,GY-70,sx+6,GY-140); ctx.stroke();
  ctx.fillStyle = '#2F7A4A';
  for (let i=0;i<5;i++){
    const ang = -Math.PI*0.95 + i*Math.PI*0.45 + Math.sin(tick*0.03+i)*0.05;
    ctx.save(); ctx.translate(sx+6,GY-140); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(30,-16,62,6); ctx.quadraticCurveTo(30,-2,0,0); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#6B4A2A'; circle(sx+2,GY-134,5); circle(sx+11,GY-132,5);
}

function drawDeadTree(x){
  const sx = x - camX; if (sx < -120 || sx > W+120) return;
  ctx.strokeStyle = '#5B5450'; ctx.lineCap = 'round';
  ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(sx,GY); ctx.quadraticCurveTo(sx-8,GY-60,sx+4,GY-120); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx-2,GY-70); ctx.lineTo(sx-30,GY-100); ctx.moveTo(sx+2,GY-95); ctx.lineTo(sx+30,GY-118);
  ctx.moveTo(sx-24,GY-94); ctx.lineTo(sx-30,GY-118); ctx.moveTo(sx+4,GY-120); ctx.lineTo(sx-6,GY-140); ctx.stroke();
  ctx.fillStyle = '#7D7873'; ellipse(sx+40,GY-6,22,10); ellipse(sx+58,GY-4,12,7);
}

function drawGround(){
  for (const [a,b] of ground){
    const x1 = a - camX, x2 = b - camX; if (x2 < 0 || x1 > W) continue;
    ctx.fillStyle = T.sand[0]; ctx.beginPath(); ctx.roundRect(x1, GY, x2-x1, H-GY+20, [14,14,0,0]); ctx.fill();
    ctx.fillStyle = T.sand[1]; ctx.beginPath(); ctx.roundRect(x1, GY, x2-x1, 14, [14,14,0,0]); ctx.fill();
    ctx.fillStyle = 'rgba(122,78,48,.25)';
    for (let x = a + 30; x < b - 20; x += 70) circle(x - camX, GY + 35 + (x%3)*12, 3);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ellipse(x1+4, GY+40, 6, 3); ellipse(x2-4, GY+40, 6, 3);
  }
}

function drawPlats(){
  for (const pl of plats){
    const x = pl.x - camX; if (x + pl.w < 0 || x > W) continue;
    ctx.fillStyle = '#5E3B24'; ctx.fillRect(x+10, pl.y+10, 6, 24); ctx.fillRect(x+pl.w-16, pl.y+10, 6, 24);
    ctx.fillStyle = '#8A5A3B'; ctx.beginPath(); ctx.roundRect(x, pl.y, pl.w, 14, 4); ctx.fill();
    ctx.strokeStyle = '#5E3B24'; ctx.lineWidth = 2;
    for (let i=30;i<pl.w;i+=30){ ctx.beginPath(); ctx.moveTo(x+i, pl.y+2); ctx.lineTo(x+i, pl.y+12); ctx.stroke(); }
  }
}

function drawCoins(){
  for (const c of coins){
    if (c.got) continue;
    const x = c.x - camX; if (x < -20 || x > W+20) continue;
    const s = Math.abs(Math.cos(tick*0.06 + c.x*0.01));
    ctx.fillStyle = '#B97A10'; ellipse(x, c.y, 9*s+1.5, 9);
    ctx.fillStyle = '#F2C230'; ellipse(x, c.y, 7*s+1, 7);
  }
}

function drawCrab(cr){
  const x = cr.x - camX; if (x < -60 || x > W+60) return;
  if (cr.dead){
    if (cr.dead > 30) return;
    ctx.globalAlpha = 1 - cr.dead/30; ctx.fillStyle = '#D4452E'; ellipse(x+cr.w/2, cr.y+cr.h-4, 20, 5); ctx.globalAlpha = 1; return;
  }
  const cx = x + cr.w/2, cy = cr.y + 12, k = Math.sin(tick*0.3 + cr.x)*2;
  ctx.strokeStyle = '#A8301F'; ctx.lineWidth = 3;
  for (let i=-1;i<=1;i+=2) for (let j=0;j<3;j++){ ctx.beginPath(); ctx.moveTo(cx+i*10, cy+4); ctx.lineTo(cx+i*(18+j*3), cy+12+(j%2?k:-k)); ctx.stroke(); }
  ctx.fillStyle = '#D4452E'; ellipse(cx, cy, 18, 11); circle(cx-20, cy-8+k, 6); circle(cx+20, cy-8-k, 6);
  ctx.strokeStyle = '#D4452E'; ctx.beginPath(); ctx.moveTo(cx-5,cy-8); ctx.lineTo(cx-6,cy-16); ctx.moveTo(cx+5,cy-8); ctx.lineTo(cx+6,cy-16); ctx.stroke();
  ctx.fillStyle = '#FFF6E2'; circle(cx-6,cy-17,3.5); circle(cx+6,cy-17,3.5);
  ctx.fillStyle = '#2B2118'; circle(cx-6+cr.dir,cy-17,1.8); circle(cx+6+cr.dir,cy-17,1.8);
}

function drawPirate(en){
  const x = en.x - camX; if (x < -60 || x > W+60) return;
  if (en.dead){
    if (en.dead > 30) return;
    ctx.globalAlpha = 1 - en.dead/30; ctx.fillStyle = '#A8301F'; ellipse(x+en.w/2, en.base+en.h-5, 18, 6); ctx.globalAlpha = 1; return;
  }
  ctx.save(); ctx.translate(x + en.w/2, en.y + en.h); ctx.scale(en.dir, 1);
  const air = en.y < en.base - 1, run = air ? 0 : Math.sin(tick*0.4 + en.x)*3;
  ctx.fillStyle = '#4A3A2E'; ctx.fillRect(-8+run,-13,6,11); ctx.fillRect(2-run,-13,6,11);
  ctx.fillStyle = '#1F1A17'; ctx.fillRect(-9+run,-3,8,3); ctx.fillRect(1-run,-3,8,3);
  ctx.fillStyle = '#F4F1E8'; ctx.beginPath(); ctx.roundRect(-10,-31,20,19,4); ctx.fill();
  ctx.fillStyle = '#A8301F'; for (let yy=-28; yy<-13; yy+=5) ctx.fillRect(-10,yy,20,2.5);
  ctx.fillStyle = '#2B2118'; ctx.fillRect(-10,-15,20,3);
  ctx.strokeStyle = '#D9A574'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6,-26); ctx.lineTo(12,-20); ctx.stroke();
  ctx.strokeStyle = '#C9CED2'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(12,-20); ctx.quadraticCurveTo(24,-26,24,-38); ctx.stroke();
  ctx.fillStyle = '#E8A33D'; circle(12,-20,2.5);
  ctx.fillStyle = '#D9A574'; circle(1,-38,8);
  ctx.fillStyle = '#2B2118'; ctx.beginPath(); ctx.arc(1,-39,8.6,Math.PI,0); ctx.fill();
  tri(-7,-40,-15,-36,-13,-44);
  ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6,-41); ctx.lineTo(8,-35); ctx.stroke();
  ctx.fillStyle = '#2B2118'; ellipse(5,-37,2.8,2.4);
  ctx.fillStyle = 'rgba(60,45,35,.45)'; ctx.beginPath(); ctx.arc(2,-34,6,0.1,Math.PI-0.1); ctx.fill();
  ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(3,-32); ctx.lineTo(8,-33); ctx.stroke();
  ctx.restore();
}

function drawMonkey(mx, my, face, scale, wave){
  const b = Math.abs(Math.sin(tick*0.08))*-3;
  ctx.save(); ctx.translate(mx, my); ctx.scale(face*scale, scale);
  ctx.strokeStyle = '#7A4E30'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10,-8); ctx.quadraticCurveTo(-28,-10,-24,-30); ctx.stroke();
  ctx.fillStyle = '#7A4E30'; ellipse(0,-12+b,12,12); circle(0,-32+b,10); circle(-10,-34+b,4.5); circle(10,-34+b,4.5);
  ctx.fillStyle = '#E8C49A'; ellipse(1,-30+b,7,6); ellipse(0,-10+b,7,8);
  ctx.fillStyle = '#2B2118'; circle(-2,-33+b,1.6); circle(4,-33+b,1.6);
  ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(1,-29+b,3,0.2,Math.PI-0.2); ctx.stroke();
  if (wave){
    ctx.strokeStyle = '#7A4E30'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(9,-16+b); ctx.lineTo(18,-30+b+Math.sin(tick*0.2)*5); ctx.stroke();
  }
  ctx.restore();
}

function drawSen(sx, sy){
  const b = Math.abs(Math.sin(tick*0.07))*-2;
  ctx.save(); ctx.translate(sx, sy); ctx.scale(-1,1);
  ctx.fillStyle = '#2B2B2B'; ctx.fillRect(-7,-11,6,9); ctx.fillRect(1,-11,6,9);
  ctx.fillStyle = '#D9A574'; ctx.fillRect(-7,-3,7,3); ctx.fillRect(1,-3,7,3);
  ctx.translate(0,b);
  ctx.fillStyle = '#7A4FA0'; ctx.beginPath(); ctx.roundRect(-9,-28,18,18,4); ctx.fill();
  ctx.fillStyle = '#E8A33D'; ctx.fillRect(-9,-15,18,3);
  ctx.strokeStyle = '#D9A574'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(5,-24); ctx.lineTo(14,-34+Math.sin(tick*0.2)*4); ctx.stroke();
  ctx.fillStyle = '#F2E2B8'; ctx.save(); ctx.translate(-10,-20); ctx.rotate(-0.4); ctx.fillRect(-3,-9,6,18); ctx.restore();
  ctx.fillStyle = '#E8B98A'; circle(2,-36,8);
  ctx.fillStyle = '#1F1A17'; ctx.beginPath(); ctx.arc(2,-38,8.6,Math.PI*0.95,Math.PI*1.95); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9,-32+Math.sin(tick*0.1)*1.5,3.5,9,0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#C8402C'; circle(-6,-40,2.5);
  ctx.fillStyle = '#2B2118'; ellipse(6,-36,1.4,2);
  ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(5,-32,2.6,0.1,Math.PI-0.5); ctx.stroke();
  ctx.restore();
}

function drawGoal(){
  const x = goal.x - camX; if (x < -160 || x > W+160) return;
  ctx.fillStyle = '#9C9384'; ctx.beginPath(); ctx.roundRect(x, GY-40, goal.w, 40, [6,6,0,0]); ctx.fill();
  ctx.fillStyle = '#B8AF9F'; ctx.beginPath(); ctx.roundRect(x-4, GY-46, goal.w+8, 10, 4); ctx.fill();
  const cx = x + goal.w/2, cy = GY - 70 + Math.sin(tick*0.06)*4;
  const g = ctx.createRadialGradient(cx,cy,4,cx,cy,50);
  g.addColorStop(0,'rgba(255,230,120,.9)'); g.addColorStop(1,'rgba(255,230,120,0)');
  ctx.fillStyle = g; ctx.fillRect(cx-50,cy-50,100,100);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(tick*0.03)*0.2 + lvl*Math.PI/2);
  ctx.fillStyle = '#C98A1B'; ctx.beginPath(); ctx.moveTo(-12,10); ctx.arc(-12,10,26,-Math.PI/2,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F6E3A8'; ctx.beginPath(); ctx.moveTo(-12,10); ctx.arc(-12,10,21,-Math.PI/2,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#C8402C'; tri(-10,8,-2,-6,0,6);
  ctx.restore();
  if (lvl === 0) drawMonkey(x + goal.w + 30, GY, -1, 1, true);
  else drawSen(x + goal.w + 30, GY);
}

function drawHero(p){
  ctx.save();
  ctx.translate(p.x - camX + p.w/2, p.y + p.h); ctx.scale(p.face, 1);
  if (p.inv > 0 && Math.floor(p.inv/5) % 2) ctx.globalAlpha = .35;
  const moving = p.onGround && Math.abs(p.vx) > 0.5;
  const run = moving ? Math.sin(tick*0.45)*4 : 0;
  const bob = moving ? Math.abs(Math.sin(tick*0.45))*-2 : 0;
  ctx.fillStyle = '#2B2B2B';
  if (p.onGround){ ctx.fillRect(-7+run,-11,6,9); ctx.fillRect(1-run,-11,6,9); }
  else { ctx.fillRect(-8,-13,6,8); ctx.fillRect(3,-10,6,8); }
  ctx.fillStyle = '#D9A574';
  if (p.onGround){ ctx.fillRect(-7+run,-3,7,3); ctx.fillRect(1-run,-3,7,3); }
  ctx.translate(0,bob);
  ctx.strokeStyle = '#D9A574'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4,-24); ctx.lineTo(-10-run,-14); ctx.stroke();
  ctx.fillStyle = '#2F7FB8'; ctx.beginPath(); ctx.roundRect(-9,-27,18,17,4); ctx.fill();
  ctx.strokeStyle = '#1E5E8C'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(2,-26); ctx.lineTo(2,-11); ctx.stroke();
  ctx.fillStyle = '#FFF6E2'; circle(4,-22,1); circle(4,-16,1);
  ctx.fillStyle = '#2B2118'; ctx.beginPath(); ctx.roundRect(-8,-29,16,5,2); ctx.fill();
  ctx.fillStyle = '#F4F1E8'; for (let i=-7;i<8;i+=4) ctx.fillRect(i,-28,2,2);
  const fl = Math.sin(tick*0.3)*2;
  ctx.fillStyle = '#2B2118'; tri(-7,-28,-16,-25+fl,-14,-30+fl);
  ctx.fillStyle = '#F4F1E8'; ctx.fillRect(-13,-28+fl*0.5,2,2);
  ctx.strokeStyle = '#D9A574'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(5,-24); ctx.lineTo(11+run,-14); ctx.stroke();
  ctx.fillStyle = '#E8B98A'; circle(2,-36,8);
  ctx.fillStyle = '#1F1A17'; ctx.beginPath(); ctx.arc(1,-37,8.5,Math.PI*0.75,Math.PI*1.25); ctx.lineTo(-2,-38); ctx.fill();
  ctx.fillStyle = '#2B2118'; ellipse(6,-37,1.4,2);
  ctx.strokeStyle = '#2B2118'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(5,-33,3,0.1,Math.PI-0.6); ctx.stroke();
  ctx.fillStyle = 'rgba(214,96,80,.45)'; circle(0,-33,1.8);
  ctx.strokeStyle = '#8A6A2E'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-5,-41); ctx.lineTo(1,-29); ctx.lineTo(8,-41); ctx.stroke();
  ctx.fillStyle = '#E9D49A'; tri(-14,-41,2,-56,18,-41);
  ctx.strokeStyle = '#C4A660'; ctx.lineWidth = 1;
  for (let k=1;k<4;k++){ const yy=-41-k*3.7, half=16*(1-k*3.7/15); ctx.beginPath(); ctx.moveTo(2-half,yy); ctx.lineTo(2+half,yy); ctx.stroke(); }
  ctx.restore();
}

function drawFollower(){
  if (lvl < 1 || trail.length < 2) return;
  const t = trail[Math.max(0, trail.length - 24)];
  drawMonkey(t.x - camX - t.f*22, t.y, t.f, 0.7, false);
}

function drawFog(){
  if (L.theme !== 'fog') return;
  const px = player.x - camX + player.w/2, py = player.y + player.h/2;
  const g = ctx.createRadialGradient(px,py,80,px,py,280);
  g.addColorStop(0,'rgba(214,222,226,0)'); g.addColorStop(1,'rgba(214,222,226,.94)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(240,244,246,.28)';
  for (let i=-1;i<W/300+2;i++){
    const ox = i*300 - wrap(camX*0.6 + tick*0.5, 300);
    ellipse(ox+60, 250, 90, 18); ellipse(ox+200, 330, 110, 20); ellipse(ox+120, 160, 70, 14);
  }
}

function drawHUD(){
  for (let i=0;i<3;i++){
    const x = 22 + i*28, y = 26;
    ctx.fillStyle = i < lives ? '#D4452E' : 'rgba(43,33,24,.25)';
    ctx.beginPath(); ctx.moveTo(x,y+8); ctx.bezierCurveTo(x-14,y-2,x-6,y-12,x,y-4); ctx.bezierCurveTo(x+6,y-12,x+14,y-2,x,y+8); ctx.fill();
  }
  ctx.fillStyle = '#B97A10'; circle(W-92, 24, 10);
  ctx.fillStyle = '#F2C230'; circle(W-92, 24, 7.5);
  ctx.fillStyle = '#2B2118'; ctx.font = '700 22px "Baloo 2", system-ui, sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText('× ' + (bank + score), W-76, 26);
  const prog = Math.min(1, player.x / goal.x);
  ctx.fillStyle = 'rgba(43,33,24,.2)'; ctx.beginPath(); ctx.roundRect(W/2-90, 20, 180, 8, 4); ctx.fill();
  ctx.fillStyle = '#1B6E7A'; ctx.beginPath(); ctx.roundRect(W/2-90, 20, Math.max(8, 180*prog), 8, 4); ctx.fill();
  ctx.font = '700 15px "Baloo 2", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(L.name, W/2, 44); ctx.textAlign = 'left';
}

function draw(){
  drawBackground();
  L.decor.forEach(L.theme === 'fog' ? drawDeadTree : drawPalm);
  drawGround(); drawPlats(); drawCoins(); drawGoal();
  enemies.forEach(en => en.kind === 'crab' ? drawCrab(en) : drawPirate(en));
  drawFollower(); drawHero(player);
  drawFog(); drawHUD();
}

let last = performance.now();
function loop(now){
  const d = Math.min((now - last) / 16.667, 2.5);
  last = now; tick += d;
  if (state === 'play') update(d);
  draw();
  requestAnimationFrame(loop);
}
showIntro(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
